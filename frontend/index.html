  <!-- ─── Styles ───────────────────────────────────────────────────── -->
  <style>
    /* ── Reset ─────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Design Tokens ──────────────────────────────────────────────── */
    :root {
      /* palette */
      --c-bg:        #030d1c;
      --c-bg-mid:    #071428;
      --c-accent:    #00c8da;
      --c-accent-dim:#007b88;
      --c-navy:      #0f4c81;
      --c-text:      #ddeaf7;
      --c-muted:     #3a5670;
      --c-faint:     rgba(0, 200, 218, 0.07);

      /* type */
      --f-sans: 'Poppins', sans-serif;
      --f-mono: 'JetBrains Mono', monospace;

      /* motion */
      --dur-rise: 0.85s;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);

      /* layout */
      --splash-radius: min(30vmin, 180px);
    }

    /* ── Base ───────────────────────────────────────────────────────── */
    html, body {
      width: 100%; height: 100%;
      background: var(--c-bg);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #root { width: 100%; height: 100%; }

    /* ── Skip flag ──────────────────────────────────────────────────── */
    html.splash-skip #splash { display: none !important; }

    /* ── Reduced motion ─────────────────────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      #splash * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }

    /* ══════════════════════════════════════════════════════════════════
       SPLASH SCREEN
    ══════════════════════════════════════════════════════════════════ */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--c-bg);
      overflow: hidden;
      isolation: isolate;

      /* dismiss transition */
      transition: opacity 0.55s var(--ease-out), visibility 0.55s;
    }

    #splash.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* ── Full-bleed canvas ───────────────────────────────────────────── */
    #splash-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      will-change: transform; /* own compositor layer */
    }

    /* ── Scan-line overlay (pure CSS, zero JS) ───────────────────────── */
    #splash::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent               0px,
        transparent               2px,
        rgba(0, 0, 0, 0.06)       2px,
        rgba(0, 0, 0, 0.06)       4px
      );
      pointer-events: none;
      z-index: 2;
    }

    /* ── Atmospheric radial vignette ──────────────────────────────────── */
    #splash-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(
        ellipse 75% 65% at 50% 40%,
        transparent 30%,
        rgba(3, 13, 28, 0.55) 70%,
        rgba(3, 13, 28, 0.90) 100%
      );
      pointer-events: none;
      z-index: 1;
    }

    /* ── Content ─────────────────────────────────────────────────────── */
    .splash-content {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    /* ── Logo badge ──────────────────────────────────────────────────── */
    .splash-logo {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: rgba(3, 13, 28, 0.80);
      border: 1px solid rgba(0, 200, 218, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      box-shadow: 0 0 0 6px rgba(0, 200, 218, 0.05),
                  0 0 32px rgba(0, 200, 218, 0.10);

      animation: rise var(--dur-rise) 0.2s var(--ease-out) both;
    }

    .splash-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* ── Wordmark ─────────────────────────────────────────────────────── */
    .splash-wordmark {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2rem;
      animation: rise var(--dur-rise) 0.32s var(--ease-out) both;
    }

    .splash-title {
      font-family: var(--f-sans);
      font-weight: 700;
      font-size: clamp(1.8rem, 5vw, 2.4rem);
      letter-spacing: 0.06em;
      color: var(--c-text);
      line-height: 1;
    }

    .splash-title em {
      font-style: normal;
      color: var(--c-accent);
    }

    .splash-tagline {
      font-family: var(--f-mono);
      font-size: clamp(0.52rem, 1.5vw, 0.62rem);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--c-muted);
    }

    /* ── HUD status row ───────────────────────────────────────────────── */
    .splash-status {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.25rem;
      animation: rise var(--dur-rise) 0.44s var(--ease-out) both;
    }

    .splash-status-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--c-accent);
      animation: dot-pulse 1.8s ease-in-out infinite;
    }

    .splash-status-text {
      font-family: var(--f-mono);
      font-size: 0.58rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--c-muted);
    }

    /* ── Progress bar ─────────────────────────────────────────────────── */
    .splash-progress {
      width: min(220px, 60vw);
      height: 1px;
      background: rgba(0, 200, 218, 0.10);
      border-radius: 1px;
      overflow: hidden;
      margin-top: 0.5rem;
      animation: rise var(--dur-rise) 0.52s var(--ease-out) both;
    }

    .splash-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--c-accent-dim), var(--c-accent));
      border-radius: 1px;
      transition: width 0.4s ease;
      box-shadow: 0 0 8px var(--c-accent);
    }

    /* ── Footer ──────────────────────────────────────────────────────── */
    .splash-footer {
      position: absolute;
      bottom: 2rem;
      z-index: 3;
      font-family: var(--f-mono);
      font-size: 0.54rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--c-muted);
      opacity: 0.45;
      text-align: center;
      padding: 0 2rem;
      animation: rise var(--dur-rise) 0.60s var(--ease-out) both;
    }

    /* ── Corner HUD decorations ──────────────────────────────────────── */
    .splash-hud-corner {
      position: absolute;
      width: 20px;
      height: 20px;
      z-index: 3;
      opacity: 0.3;
      animation: rise var(--dur-rise) 0.65s var(--ease-out) both;
    }
    .splash-hud-corner--tl { top: 1.5rem; left: 1.5rem;
      border-top: 1px solid var(--c-accent); border-left: 1px solid var(--c-accent); }
    .splash-hud-corner--tr { top: 1.5rem; right: 1.5rem;
      border-top: 1px solid var(--c-accent); border-right: 1px solid var(--c-accent); }
    .splash-hud-corner--bl { bottom: 1.5rem; left: 1.5rem;
      border-bottom: 1px solid var(--c-accent); border-left: 1px solid var(--c-accent); }
    .splash-hud-corner--br { bottom: 1.5rem; right: 1.5rem;
      border-bottom: 1px solid var(--c-accent); border-right: 1px solid var(--c-accent); }

    /* ── Keyframes ───────────────────────────────────────────────────── */
    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes dot-pulse {
      0%, 70%, 100% { opacity: 0.25; transform: scale(1); }
      35%           { opacity: 1;    transform: scale(1.5); }
    }
  </style>
</head>

<body>

  <!-- ─── Splash ───────────────────────────────────────────────────── -->
  <div
    id="splash"
    role="status"
    aria-label="Loading WaveLab"
    aria-live="polite"
    aria-busy="true"
  >

    <canvas id="splash-canvas" aria-hidden="true"></canvas>
    <div id="splash-vignette" aria-hidden="true"></div>

    <!-- HUD corners -->
    <div class="splash-hud-corner splash-hud-corner--tl" aria-hidden="true"></div>
    <div class="splash-hud-corner splash-hud-corner--tr" aria-hidden="true"></div>
    <div class="splash-hud-corner splash-hud-corner--bl" aria-hidden="true"></div>
    <div class="splash-hud-corner splash-hud-corner--br" aria-hidden="true"></div>

    <div class="splash-content">

      <div class="splash-logo" aria-hidden="true">
        <img src="/pagasa-logo.png" alt="" role="presentation" />
      </div>

      <div class="splash-wordmark">
        <h1 class="splash-title">Wave<em>Lab</em></h1>
        <p class="splash-tagline">DOST-PAGASA · Wave Forecasting Platform</p>
      </div>

      <div class="splash-status" aria-hidden="true">
        <div class="splash-status-dot"></div>
        <span class="splash-status-text" id="splash-status-label">Initialising</span>
      </div>

      <div class="splash-progress" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-label="Loading progress">
        <div class="splash-progress-fill" id="splash-bar"></div>
      </div>

    </div>

    <p class="splash-footer" aria-hidden="true">
      Department of Science and Technology —
      Philippine Atmospheric, Geophysical and Astronomical Services Administration
    </p>

  </div>

  <!-- ─── App Root ──────────────────────────────────────────────────── -->
  <div id="root"></div>

  <!-- ─── Canvas Renderer ──────────────────────────────────────────── -->
  <script>
  'use strict';

  (function SplashRenderer() {

    /* ── constants ──────────────────────────────────────────────────── */
    const SWEEP_SPEED  = 0.50;          // rotations / second
    const SWEEP_TRAIL  = Math.PI * 1.2; // arc length in radians
    const RINGS        = 4;
    const RING_LABELS  = ['N', 'E', 'S', 'W'];

    const BLIPS = [
      { a: 0.08, r: 0.40, size: 2.8 },
      { a: 0.22, r: 0.58, size: 2.2 },
      { a: 0.37, r: 0.27, size: 3.0 },
      { a: 0.53, r: 0.65, size: 2.4 },
      { a: 0.66, r: 0.44, size: 2.6 },
      { a: 0.79, r: 0.55, size: 2.0 },
      { a: 0.91, r: 0.33, size: 2.8 },
      { a: 0.46, r: 0.72, size: 2.0 },
    ];

    // blip "last-hit" timestamp for ripple rings
    const blipLastHit = new Array(BLIPS.length).fill(-Infinity);

    const WAVES = [
      { amp: 22, freq: 0.017, speed: 0.011, yR: 0.70, alpha: 0.14, color: '#00c8da' },
      { amp: 14, freq: 0.024, speed: 0.017, yR: 0.75, alpha: 0.09, color: '#0f4c81' },
      { amp: 26, freq: 0.013, speed: 0.008, yR: 0.81, alpha: 0.08, color: '#00c8da' },
      { amp:  9, freq: 0.031, speed: 0.024, yR: 0.66, alpha: 0.05, color: '#5be8f5' },
      { amp: 17, freq: 0.019, speed: 0.014, yR: 0.86, alpha: 0.11, color: '#0f4c81' },
    ];

    /* ── state ──────────────────────────────────────────────────────── */
    const canvas = document.getElementById('splash-canvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let W, H, DPR, raf, t0 = null;
    let running = true;

    /* ── resize (debounced with ResizeObserver) ─────────────────────── */
    function setSize() {
      DPR = window.devicePixelRatio || 1;
      W   = canvas.offsetWidth;
      H   = canvas.offsetHeight;
      canvas.width  = Math.round(W * DPR);
      canvas.height = Math.round(H * DPR);
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }

    let resizeTimer;
    const ro = new ResizeObserver(() => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(setSize, 60);
    });
    ro.observe(canvas);
    setSize();

    /* ── reduce-motion guard ─────────────────────────────────────────── */
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* ── helpers ─────────────────────────────────────────────────────── */
    function sonarCentre() {
      return { cx: W / 2, cy: H * 0.40, maxR: Math.min(W, H) * 0.29 };
    }

    /* ── draw: compass rose ──────────────────────────────────────────── */
    function drawCompass(cx, cy, maxR) {
      ctx.save();
      ctx.font = '500 9px "JetBrains Mono", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const dist = maxR + 14;
      const dirs = [
        { label: 'N', dx:  0, dy: -1 },
        { label: 'E', dx:  1, dy:  0 },
        { label: 'S', dx:  0, dy:  1 },
        { label: 'W', dx: -1, dy:  0 },
      ];
      dirs.forEach(({ label, dx, dy }) => {
        ctx.globalAlpha = 0.35;
        ctx.fillStyle   = '#00c8da';
        ctx.fillText(label, cx + dx * dist, cy + dy * dist);
      });
      ctx.restore();
    }

    /* ── draw: sonar grid ────────────────────────────────────────────── */
    function drawSonarGrid(cx, cy, maxR) {
      // range rings
      for (let i = 1; i <= RINGS; i++) {
        const r = (i / RINGS) * maxR;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.strokeStyle   = '#00c8da';
        ctx.globalAlpha   = i === RINGS ? 0.12 : 0.07;
        ctx.lineWidth     = 0.75;
        ctx.stroke();
      }
      // crosshairs
      ctx.globalAlpha = 0.06;
      ctx.strokeStyle = '#00c8da';
      ctx.lineWidth   = 0.5;
      for (let i = 0; i < 4; i++) {
        const a = i * Math.PI / 4;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(a) * maxR, cy + Math.sin(a) * maxR);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    /* ── draw: sweep trail + line ────────────────────────────────────── */
    function drawSweep(cx, cy, maxR, angle) {
      const STEPS = 72;
      for (let s = 0; s < STEPS; s++) {
        const a0   = angle - SWEEP_TRAIL * ((s + 1) / STEPS);
        const a1   = angle - SWEEP_TRAIL * (s / STEPS);
        const fade = s / STEPS;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, maxR, a0, a1);
        ctx.closePath();
        ctx.fillStyle   = '#00c8da';
        ctx.globalAlpha = fade * fade * 0.20;
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      // sweep line
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(angle) * maxR, cy + Math.sin(angle) * maxR);
      ctx.strokeStyle = '#00c8da';
      ctx.globalAlpha = 0.85;
      ctx.lineWidth   = 1.5;
      ctx.stroke();

      // origin dot
      ctx.beginPath();
      ctx.arc(cx, cy, 2.5, 0, Math.PI * 2);
      ctx.fillStyle   = '#00c8da';
      ctx.globalAlpha = 0.90;
      ctx.fill();

      ctx.globalAlpha = 1;
    }

    /* ── draw: blips with ripple rings ───────────────────────────────── */
    function drawBlips(cx, cy, maxR, angle, elapsed) {
      BLIPS.forEach((blip, i) => {
        const ba = blip.a * Math.PI * 2;
        const bx = cx + Math.cos(ba) * blip.r * maxR;
        const by = cy + Math.sin(ba) * blip.r * maxR;

        // how far behind the sweep arm is this blip?
        const behind = (angle - ba + Math.PI * 2) % (Math.PI * 2);

        // record last-hit moment
        if (behind < 0.04) blipLastHit[i] = elapsed;

        if (behind > SWEEP_TRAIL * 1.35) return;

        const intensity = Math.max(0, 1 - behind / (SWEEP_TRAIL * 1.35));
        const dotR = blip.size + intensity * 1.8;

        // glow halo
        ctx.beginPath();
        ctx.arc(bx, by, dotR + 6, 0, Math.PI * 2);
        ctx.fillStyle   = '#00ffcc';
        ctx.globalAlpha = intensity * 0.14;
        ctx.fill();

        // core dot
        ctx.beginPath();
        ctx.arc(bx, by, dotR, 0, Math.PI * 2);
        ctx.fillStyle   = '#00ffcc';
        ctx.globalAlpha = intensity * 0.88;
        ctx.fill();

        // ripple rings (expand outward from last hit)
        const age = elapsed - blipLastHit[i];
        if (age < 2.0 && age >= 0) {
          for (let ring = 0; ring < 2; ring++) {
            const rAge    = age - ring * 0.45;
            if (rAge < 0) continue;
            const rProg   = Math.min(rAge / 1.0, 1);
            const rRadius = dotR + rProg * 18;
            const rAlpha  = (1 - rProg) * 0.30 * intensity;
            ctx.beginPath();
            ctx.arc(bx, by, rRadius, 0, Math.PI * 2);
            ctx.strokeStyle = '#00ffcc';
            ctx.globalAlpha = rAlpha;
            ctx.lineWidth   = 0.75;
            ctx.stroke();
          }
        }

        ctx.globalAlpha = 1;
      });
    }

    /* ── draw: wave layer ────────────────────────────────────────────── */
    function drawWave(wave, elapsed) {
      const baseY = H * wave.yR;
      const step  = 3;

      function calcY(x) {
        return baseY
          + Math.sin(x * wave.freq + elapsed * wave.speed * 60) * wave.amp
          + Math.sin(x * wave.freq * 1.7 + elapsed * wave.speed * 38) * wave.amp * 0.38;
      }

      // filled body
      ctx.beginPath();
      for (let x = 0; x <= W; x += step) {
        x === 0 ? ctx.moveTo(x, calcY(x)) : ctx.lineTo(x, calcY(x));
      }
      ctx.lineTo(W, H);
      ctx.lineTo(0, H);
      ctx.closePath();
      ctx.fillStyle   = wave.color;
      ctx.globalAlpha = wave.alpha;
      ctx.fill();

      // crest stroke
      ctx.beginPath();
      for (let x = 0; x <= W; x += step) {
        x === 0 ? ctx.moveTo(x, calcY(x)) : ctx.lineTo(x, calcY(x));
      }
      ctx.strokeStyle = wave.color;
      ctx.globalAlpha = wave.alpha * 2.8;
      ctx.lineWidth   = 1;
      ctx.stroke();

      ctx.globalAlpha = 1;
    }

    /* ── draw: coordinate HUD readout ────────────────────────────────── */
    function drawHUD(cx, cy, angle) {
      const deg  = ((angle * 180 / Math.PI) % 360 + 360) % 360;
      const text = `HDG ${deg.toFixed(1).padStart(5, '0')}°`;
      ctx.save();
      ctx.font         = '400 9px "JetBrains Mono", monospace';
      ctx.textAlign    = 'left';
      ctx.textBaseline = 'top';
      ctx.fillStyle    = '#00c8da';
      ctx.globalAlpha  = 0.22;
      ctx.fillText(text, cx - (Math.min(W, H) * 0.29) - 4, cy + (Math.min(W, H) * 0.29) + 6);
      ctx.restore();
    }

    /* ── main render loop ────────────────────────────────────────────── */
    function frame(ts) {
      if (!running) return;
      if (t0 === null) t0 = ts;
      const elapsed = (ts - t0) / 1000;

      ctx.clearRect(0, 0, W, H);

      const { cx, cy, maxR } = sonarCentre();
      const angle = reducedMotion ? 0 : (elapsed * SWEEP_SPEED * Math.PI * 2) % (Math.PI * 2);

      drawSonarGrid(cx, cy, maxR);
      drawCompass(cx, cy, maxR);
      drawSweep(cx, cy, maxR, angle);
      drawBlips(cx, cy, maxR, angle, elapsed);
      drawHUD(cx, cy, angle);

      WAVES.forEach(w => drawWave(w, elapsed));

      raf = requestAnimationFrame(frame);
    }

    raf = requestAnimationFrame(frame);

    /* ── expose cleanup ──────────────────────────────────────────────── */
    window._splashStop = function () {
      running = false;
      cancelAnimationFrame(raf);
      ro.disconnect();
    };

  })(); // end SplashRenderer
  </script>

  <!-- ─── Progress simulation + status labels ───────────────────────── -->
  <script>
  'use strict';

  (function SplashProgress() {
    const bar    = document.getElementById('splash-bar');
    const label  = document.getElementById('splash-status-label');
    const splash = document.getElementById('splash');
    if (!bar || !splash) return;

    const progressEl = splash.querySelector('[role="progressbar"]');

    const STAGES = [
      { pct: 15,  msg: 'Initialising',    ms: 300  },
      { pct: 35,  msg: 'Loading assets',  ms: 700  },
      { pct: 60,  msg: 'Building charts', ms: 400  },
      { pct: 80,  msg: 'Loading map',     ms: 500  },
      { pct: 95,  msg: 'Almost ready',    ms: 600  },
    ];

    let stageIdx = 0;
    let appReady = false, imageReady = false;

    function advanceStage() {
      if (stageIdx >= STAGES.length) return;
      const stage = STAGES[stageIdx++];
      bar.style.width = stage.pct + '%';
      if (label)    label.textContent = stage.msg;
      if (progressEl) progressEl.setAttribute('aria-valuenow', stage.pct);
      if (stageIdx < STAGES.length) setTimeout(advanceStage, stage.ms);
    }

    advanceStage();

    function finish() {
      if (!appReady || !imageReady) return;
      bar.style.width = '100%';
      if (label)    label.textContent = 'Ready';
      if (progressEl) progressEl.setAttribute('aria-valuenow', 100);
      sessionStorage.setItem('wl_splash', '1');
      splash.setAttribute('aria-busy', 'false');
      setTimeout(dismiss, 320);
    }

    function dismiss() {
      splash.classList.add('is-hidden');
      setTimeout(() => {
        if (window._splashStop) window._splashStop();
        splash.remove();
      }, 600);
    }

    // Watch for logo image load
    const img = splash.querySelector('.splash-logo img');
    if (!img || (img.complete && img.naturalWidth > 0)) {
      imageReady = true;
    } else {
      img.addEventListener('load',  () => { imageReady = true; finish(); });
      img.addEventListener('error', () => { imageReady = true; finish(); });
    }

    // Watch for React/Vite app mount
    const observer = new MutationObserver(() => {
      const root = document.getElementById('root');
      if (root && root.childElementCount > 0) {
        observer.disconnect();
        appReady = true;
        finish();
      }
    });
    observer.observe(document.getElementById('root'), { childList: true });

    // Hard deadline — never block indefinitely
    const deadline = setTimeout(() => {
      observer.disconnect();
      imageReady = true;
      appReady   = true;
      finish();
    }, 9000);

    // Clean up if app mounts quickly
    window.addEventListener('load', () => clearTimeout(deadline), { once: true });
  })();
  </script>

  <!-- ─── Entry Point ───────────────────────────────────────────────── -->
  <script type="module" src="/src/app/main.jsx"></script>
