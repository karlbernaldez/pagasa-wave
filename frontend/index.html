  <!-- ─── Splash: skip on repeat visits (runs before first paint) ───── -->
  <script>
    if (localStorage.getItem('wavelab_splash_seen')) {
      document.documentElement.classList.add('splash-skip');
    }
  </script>

  <!-- ─── Splash Screen ─────────────────────────────────────────────── -->
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --splash-bg: #050d1a;
      --splash-surface: #0a1628;
      --splash-accent: #00c6d7;
      --splash-mid: #0f4c81;
      --splash-text: #e2eaf5;
      --splash-muted: #4a6280;
      --font-mono: 'JetBrains Mono', monospace;
      --font-sans: 'Poppins', sans-serif;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: var(--splash-bg);
      overflow: hidden;
    }

    #root {
      width: 100%;
      height: 100%;
    }

    /* ── Hide splash entirely on repeat visits ── */
    html.splash-skip #splash {
      display: none !important;
    }

    /* ── Splash wrapper ── */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--splash-bg);
      gap: 2rem;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    #splash.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* ── Ocean grid ── */
    .splash-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 198, 215, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 198, 215, 0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 80% 60% at 50% 50%, black 30%, transparent 100%);
    }

    /* ── Radial glow ── */
    .splash-glow {
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 198, 215, 0.08) 0%, transparent 70%);
      animation: pulse-glow 3s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% { transform: scale(1);   opacity: 0.6; }
      50%       { transform: scale(1.1); opacity: 1;   }
    }

    /* ── Logo block ── */
    .splash-logo {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
    }

    .splash-icon {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 40px rgba(0, 198, 215, 0.25), 0 0 0 1px rgba(0, 198, 215, 0.15);
      animation: icon-appear 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      padding: 10px;
    }

    @keyframes icon-appear {
      from { transform: scale(0.6) rotate(-10deg); opacity: 0; }
      to   { transform: scale(1)   rotate(0deg);   opacity: 1; }
    }

    .splash-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 8px rgba(0, 198, 215, 0.4));
    }

    .splash-wordmark {
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: wordmark-appear 0.7s 0.15s ease both;
    }

    @keyframes wordmark-appear {
      from { transform: translateY(10px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    .splash-title {
      font-family: var(--font-sans);
      font-weight: 700;
      font-size: 2.25rem;
      letter-spacing: 0.08em;
      color: var(--splash-text);
      line-height: 1;
    }

    .splash-title span {
      background: linear-gradient(90deg, var(--splash-accent), #5be8f5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .splash-sub {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      font-weight: 400;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--splash-muted);
      margin-top: 6px;
    }

    /* ── Progress bar ── */
    .splash-progress {
      position: relative;
      z-index: 1;
      width: 220px;
      animation: progress-appear 0.6s 0.3s ease both;
    }

    @keyframes progress-appear {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .splash-progress-track {
      height: 2px;
      background: rgba(0, 198, 215, 0.12);
      border-radius: 99px;
      overflow: hidden;
    }

    .splash-progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--splash-mid), var(--splash-accent));
      border-radius: 99px;
      animation: loading-bar 2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      box-shadow: 0 0 8px rgba(0, 198, 215, 0.7);
    }

    @keyframes loading-bar {
      0%   { width: 0%; }
      60%  { width: 75%; }
      85%  { width: 88%; }
      100% { width: 100%; }
    }

    .splash-status {
      margin-top: 10px;
      font-family: var(--font-mono);
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      color: var(--splash-muted);
      text-align: center;
    }

    /* ── Footer badge ── */
    .splash-badge {
      position: absolute;
      bottom: 2rem;
      font-family: var(--font-mono);
      font-size: 0.58rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--splash-muted);
      opacity: 0.6;
      animation: wordmark-appear 0.8s 0.4s ease both;
    }
  </style>
</head>

<body>

  <!-- ─── Splash Screen ─────────────────────────────────────────────── -->
  <div id="splash" role="status" aria-label="Loading WaveLab" aria-live="polite">
    <div class="splash-grid" aria-hidden="true"></div>
    <div class="splash-glow" aria-hidden="true"></div>

    <div class="splash-logo">
      <div class="splash-icon" aria-hidden="true">
        <img src="/pagasa-logo.png" alt="PAGASA Logo" />
      </div>

      <div class="splash-wordmark">
        <div class="splash-title">Wave<span>Lab</span></div>
        <div class="splash-sub">DOST-PAGASA · Wave Forecasting Platform</div>
      </div>
    </div>

    <div class="splash-progress" aria-hidden="true">
      <div class="splash-progress-track">
        <div class="splash-progress-bar"></div>
      </div>
      <div class="splash-status" id="splash-status-text">Initializing…</div>
    </div>

    <div class="splash-badge" aria-hidden="true">Department of Science and Technology - Philippine Atmospheric,
      Geophysical and Astronomical Services Administration</div>
  </div>

  <!-- ─── App Root ──────────────────────────────────────────────────── -->
  <div id="root"></div>

  <!-- ─── Splash Dismiss ────────────────────────────────────────────── -->
  <script>
    (function () {
      var splash = document.getElementById('splash');

      // Already seen on a previous visit — splash is hidden via CSS, bail out
      if (!splash || getComputedStyle(splash).display === 'none') return;

      var status  = document.getElementById('splash-status-text');
      var logoImg = splash.querySelector('.splash-icon img');
      var labels  = ['Initializing…', 'Loading assets…', 'Mounting app…', 'Ready'];
      var idx     = 0;

      var ticker = setInterval(function () {
        idx = Math.min(idx + 1, labels.length - 1);
        if (status) status.textContent = labels[idx];
        if (idx === labels.length - 1) clearInterval(ticker);
      }, 600);

      // Two conditions must both be true before we dismiss:
      //   1. logo image has finished loading
      //   2. React has mounted at least one child into #root
      var imageReady = false;
      var appReady   = false;

      function tryDismiss() {
        if (!imageReady || !appReady) return;
        clearInterval(ticker);
        localStorage.setItem('wavelab_splash_seen', '1');
        splash.classList.add('hidden');
        setTimeout(function () {
          if (splash.parentNode) splash.parentNode.removeChild(splash);
        }, 600);
      }

      // 1. Track image load
      if (logoImg) {
        if (logoImg.complete && logoImg.naturalWidth > 0) {
          imageReady = true; // already cached
        } else {
          logoImg.addEventListener('load',  function () { imageReady = true; tryDismiss(); });
          logoImg.addEventListener('error', function () { imageReady = true; tryDismiss(); }); // broken img shouldn't block forever
        }
      } else {
        imageReady = true;
      }

      // 2. Track React mount
      var observer = new MutationObserver(function () {
        var root = document.getElementById('root');
        if (root && root.children.length > 0) {
          observer.disconnect();
          appReady = true;
          tryDismiss();
        }
      });
      observer.observe(document.getElementById('root'), { childList: true, subtree: false });

      // Hard fallback — never block past 8s
      setTimeout(function () {
        observer.disconnect();
        imageReady = true;
        appReady   = true;
        tryDismiss();
      }, 8000);
    })();
  </script>

  <!-- ─── Entry ─────────────────────────────────────────────────────── -->
  <script type="module" src="/src/app/main.jsx"></script>

</body>
