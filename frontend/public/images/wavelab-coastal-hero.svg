<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Coastal wave forecast landscape</title>
  <desc id="desc">A calm Philippine coastal scene with ocean waves, shoreline, islands, and soft morning light for the Wavelab Public landing page.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dff7ff"/>
      <stop offset="0.42" stop-color="#a8e4f5"/>
      <stop offset="1" stop-color="#eafcff"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b6fae"/>
      <stop offset="0.42" stop-color="#0ea5c6"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="deepSea" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#083e72"/>
      <stop offset="0.56" stop-color="#0b7fa4"/>
      <stop offset="1" stop-color="#12b6bd"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff7c2" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#fef3c7" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fef3c7" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1600" height="980" fill="url(#sky)"/>
  <circle cx="1180" cy="160" r="180" fill="url(#sun)"/>
  <path d="M0 458 C180 408 340 418 500 446 C650 472 760 410 930 412 C1110 414 1280 478 1600 418 L1600 980 L0 980 Z" fill="url(#sea)"/>
  <path d="M0 575 C210 530 355 562 520 592 C705 626 848 556 1050 548 C1244 540 1390 594 1600 560 L1600 980 L0 980 Z" fill="url(#deepSea)" opacity="0.78"/>

  <path d="M-40 446 C125 384 260 385 390 436 C510 482 650 474 765 420 C875 370 1015 356 1165 408 C1308 458 1450 462 1640 398 L1640 0 L-40 0 Z" fill="#ffffff" opacity="0.2"/>
  <path d="M115 510 C210 486 324 490 436 522" fill="none" stroke="#e0faff" stroke-width="7" stroke-linecap="round" opacity="0.75"/>
  <path d="M615 518 C740 484 870 490 1010 532" fill="none" stroke="#e0faff" stroke-width="7" stroke-linecap="round" opacity="0.65"/>
  <path d="M1060 662 C1215 620 1392 624 1540 674" fill="none" stroke="#dffbff" stroke-width="8" stroke-linecap="round" opacity="0.55"/>
  <path d="M160 700 C360 640 520 654 710 712" fill="none" stroke="#f8feff" stroke-width="9" stroke-linecap="round" opacity="0.45"/>

  <path d="M0 735 C145 694 288 702 410 758 C530 812 702 828 895 778 C1110 722 1304 768 1600 710 L1600 980 L0 980 Z" fill="#f8fbef" opacity="0.95"/>
  <path d="M0 795 C160 750 336 770 512 832 C702 898 882 860 1045 808 C1238 746 1410 772 1600 744 L1600 980 L0 980 Z" fill="#f5dfb8" opacity="0.88"/>

  <path d="M160 360 C220 300 300 290 392 362 C458 414 548 422 632 382 C688 354 748 358 815 412 L160 412 Z" fill="#075985" opacity="0.72"/>
  <path d="M1010 350 C1090 284 1185 296 1280 368 C1354 424 1458 414 1540 364 L1600 420 L960 420 Z" fill="#0f766e" opacity="0.55"/>

  <g opacity="0.5" filter="url(#softBlur)">
    <circle cx="248" cy="214" r="135" fill="#67e8f9"/>
    <circle cx="1390" cy="360" r="180" fill="#bae6fd"/>
  </g>

  <g opacity="0.72">
    <path d="M1270 710 C1264 660 1268 605 1300 552" fill="none" stroke="#166534" stroke-width="12" stroke-linecap="round"/>
    <path d="M1300 552 C1252 570 1216 600 1192 646" fill="none" stroke="#15803d" stroke-width="10" stroke-linecap="round"/>
    <path d="M1300 552 C1355 570 1394 600 1420 652" fill="none" stroke="#15803d" stroke-width="10" stroke-linecap="round"/>
    <path d="M1300 552 C1298 506 1280 466 1240 430" fill="none" stroke="#16a34a" stroke-width="9" stroke-linecap="round"/>
    <path d="M1300 552 C1326 506 1362 480 1412 462" fill="none" stroke="#16a34a" stroke-width="9" stroke-linecap="round"/>
  </g>
</svg>
