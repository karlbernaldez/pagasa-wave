<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Night coastal wave forecast landscape</title>
  <desc id="desc">A calm moonlit Philippine coastal scene with ocean waves, shoreline, islands, stars, and soft night light for Wavelab Public dark mode.</desc>
  <defs>
    <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.42" stop-color="#082f49"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="moonSea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06345f"/>
      <stop offset="0.44" stop-color="#075985"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="deepNightSea" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.58" stop-color="#0c4a6e"/>
      <stop offset="1" stop-color="#155e75"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e0f2fe" stop-opacity="0.98"/>
      <stop offset="0.38" stop-color="#bae6fd" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <rect width="1600" height="980" fill="url(#nightSky)"/>
  <circle cx="1160" cy="150" r="210" fill="url(#moonGlow)"/>
  <circle cx="1160" cy="150" r="54" fill="#f8fafc" opacity="0.92"/>
  <circle cx="1184" cy="132" r="48" fill="#082f49" opacity="0.26"/>

  <g opacity="0.82">
