<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc">
  <title id="title">Calm Philippine coastal waters with fishing boat</title>
  <desc id="desc">A wide coastal scene with blue sky, ocean, green shoreline, rocks, beach, and a small outrigger boat for the Wavelab Public hero section.</desc>
