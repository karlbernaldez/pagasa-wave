name: WaveLab Quality Gates

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wavelab-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Repository quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/chart-rendering-style-parity

      - name: Select comparison range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          else
            base_sha="$BEFORE_SHA"
          fi
          head_sha="$(git rev-parse HEAD)"

          echo "QUALITY_BASE_SHA=$base_sha" >> "$GITHUB_ENV"
          echo "QUALITY_HEAD_SHA=$head_sha" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked quality tools
        run: npm ci --ignore-scripts

      - name: Validate current branch quality
        run: npm run quality

      - name: Apply guarded renderer patch
        run: python .github/scripts/apply-style-parity-patch.py

      - name: Refactor preview effect state
        run: python .github/scripts/refactor-preview-hook-state.py

      - name: Format changed implementation and tests
        run: |
          npx prettier --write \
            frontend/src/features/projects/components/ProjectPreviewMap.jsx \
            frontend/src/features/projects/components/PublishedForecastExportMap.jsx \
            frontend/src/features/projects/utils/annotationStyleExpressions.js \
            frontend/src/features/projects/utils/annotationStyleExpressions.test.js \
            frontend/src/features/projects/utils/normalizeFeatureCollection.test.js

      - name: Install frontend test dependencies
        run: npm install --prefix frontend --ignore-scripts --no-audit --no-fund

      - name: Run targeted style parity tests
        run: |
          npm --prefix frontend test -- \
            src/features/projects/utils/annotationStyleExpressions.test.js \
            src/features/projects/utils/normalizeFeatureCollection.test.js

      - name: Lint generated implementation
        run: |
          npx eslint \
            frontend/src/features/projects/components/ProjectPreviewMap.jsx \
            frontend/src/features/projects/components/PublishedForecastExportMap.jsx \
            frontend/src/features/projects/utils/annotationStyleExpressions.js \
            frontend/src/features/projects/utils/annotationStyleExpressions.test.js \
            frontend/src/features/projects/utils/normalizeFeatureCollection.test.js

      - name: Commit validated renderer changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            frontend/src/features/projects/components/ProjectPreviewMap.jsx \
            frontend/src/features/projects/components/PublishedForecastExportMap.jsx \
            frontend/src/features/projects/utils/annotationStyleExpressions.js \
            frontend/src/features/projects/utils/annotationStyleExpressions.test.js \
            frontend/src/features/projects/utils/normalizeFeatureCollection.test.js
          if git diff --cached --quiet; then
            echo 'No renderer changes to commit.'
            exit 0
          fi
          git commit -m 'fix: preserve saved annotation styles in chart output'
          git push origin HEAD:fix/chart-rendering-style-parity
