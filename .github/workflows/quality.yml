name: WaveLab Quality Gates

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wavelab-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Repository quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select comparison range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          else
            base_sha="$BEFORE_SHA"
          fi

          echo "QUALITY_BASE_SHA=$base_sha" >> "$GITHUB_ENV"
          echo "QUALITY_HEAD_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked quality tools
        run: npm ci --ignore-scripts

      - name: Run incremental quality gates
        run: npm run quality

      - name: Inspect Studio and preview style contracts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo '=== FILES CONTAINING lineDash ==='
          grep -RIl --include='*.js' --include='*.jsx' 'lineDash' frontend/src | sort || true
          echo '=== STYLE CONTRACT REFERENCES ==='
          grep -RInE --include='*.js' --include='*.jsx' 'lineDash|lineCasing|lineOpacity|textHalo|iconOpacity|pointStroke' \
            frontend/src/dashboards/forecaster/components/Studio \
            frontend/src/features/projects | head -n 600 || true
          echo '=== TEST FILES NEAR PROJECT PREVIEW ==='
          find frontend/src/features/projects -type f \( -name '*.test.js' -o -name '*.test.jsx' \) | sort || true
