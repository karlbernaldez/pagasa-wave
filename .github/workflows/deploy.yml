name: WaveLab AlmaLinux Production Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wavelab-almalinux-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install and test backend
        working-directory: backend
        run: |
          npm ci
          npm test
          npm run test:workflow

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate

      - name: Install, test, and build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build

  deploy:
    name: Deploy to production AlmaLinux server
    needs: validate
    runs-on:
      - self-hosted
      - linux
      - x64
      - wavelab-production
    timeout-minutes: 40
    environment: production
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true

      - name: Deploy validated commit
        env:
          PUBLIC_HOST: ${{ vars.PUBLIC_HOST }}
        run: |
          test -n "$PUBLIC_HOST"
          sudo -n /usr/local/sbin/wavelab-deploy "$GITHUB_SHA" "$PUBLIC_HOST"

      - name: Verify services
        run: |
          systemctl is-active --quiet wavelab-backend
          curl -fsS http://127.0.0.1:5000/status >/dev/null
          curl -fsSI http://127.0.0.1/ >/dev/null
