name: Format Preview 270

on:
  push:
    branches:
      - feat/270-wave-model-schedule-controls

permissions:
  contents: write

jobs:
  prettier-preview:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked quality tools
        run: npm ci --ignore-scripts

      - name: Apply exact Prettier output
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write \
            backend/services/waveModelOperationsService.js \
            backend/services/waveModelSchedule.js \
            backend/tests/waveModelOperationsSchedule.test.js \
            deploy/almalinux/wavelab-wave-model-ops.mjs \
            frontend/src/api/waveModels.js \
            frontend/src/dashboards/admin/sections/wave-models/WaveModelSchedules.jsx
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/services/waveModelOperationsService.js \
            backend/services/waveModelSchedule.js \
            backend/tests/waveModelOperationsSchedule.test.js \
            deploy/almalinux/wavelab-wave-model-ops.mjs \
            frontend/src/api/waveModels.js \
            frontend/src/dashboards/admin/sections/wave-models/WaveModelSchedules.jsx
          git commit -m "style: format wave model schedule controls"
          git push origin HEAD:feat/270-wave-model-schedule-controls
