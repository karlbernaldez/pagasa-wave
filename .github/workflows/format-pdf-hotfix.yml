name: Format PDF hotfix

on:
  push:
    branches:
      - hotfix/published-chart-pdf-print-readiness
    paths:
      - '.github/workflows/format-pdf-hotfix.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/published-chart-pdf-print-readiness
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install repository tooling
        run: npm ci

      - name: Format PDF hotfix files
        run: |
          npx prettier --write \
            frontend/src/dashboards/public/pages/Charts.jsx \
            frontend/src/features/projects/pages/PublishedForecastPage.jsx \
            frontend/src/features/projects/utils/printWindowWhenReady.js \
            frontend/src/features/projects/utils/printWindowWhenReady.test.js

      - name: Remove temporary formatter workflow
        run: rm .github/workflows/format-pdf-hotfix.yml

      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/dashboards/public/pages/Charts.jsx
          git add frontend/src/features/projects/pages/PublishedForecastPage.jsx
          git add frontend/src/features/projects/utils/printWindowWhenReady.js
          git add frontend/src/features/projects/utils/printWindowWhenReady.test.js
          git add .github/workflows/format-pdf-hotfix.yml
          git diff --cached --quiet || git commit -m "style(pdf): apply repository prettier output"
          git push origin HEAD:hotfix/published-chart-pdf-print-readiness
