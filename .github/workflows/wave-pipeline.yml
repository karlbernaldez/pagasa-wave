name: Wave Pipeline Validation

on:
  pull_request:
    paths:
      - 'deploy/almalinux/wavelab-ww3-package-builder'
      - 'deploy/almalinux/wavelab-ecwam-package-builder'
      - 'deploy/almalinux/ww3-package-builder.env.example'
      - 'deploy/almalinux/ecwam-package-builder.env.example'
      - 'wavetiles/pipeline/**'
      - 'wavetiles/scripts/normalize_ww3_cycle.py'
      - 'wavetiles/scripts/normalize_ecwam_cycle.py'
      - 'wavetiles/scripts/build_normalized_ww3_shadow.py'
      - 'wavetiles/scripts/build_normalized_ecwam_shadow.py'
      - 'wavetiles/scripts/build_ww3_compatible_package.sh'
      - 'wavetiles/scripts/build_ecwam_compatible_package.sh'
      - 'wavetiles/scripts/run_normalized_wave_package.py'
      - 'wavetiles/scripts/write_wave_pipeline_status.py'
      - 'wavetiles/scripts/publish_wave_package.py'
      - 'wavetiles/scripts/ww3_package_selection.py'
      - 'wavetiles/scripts/ecwam_package_selection.py'
      - 'wavetiles/tests/test_wave_contract.py'
      - 'wavetiles/tests/test_normalized_reader.py'
      - 'wavetiles/tests/test_normalized_wave_runner.py'
      - 'wavetiles/tests/test_wave_pipeline_status.py'
      - 'wavetiles/tests/test_wave_package_publisher.py'
      - 'wavetiles/tests/test_ww3_adapter.py'
      - 'wavetiles/tests/test_ecwam_adapter.py'
      - 'wavetiles/tests/test_ww3_package_selection.py'
      - 'docs/architecture/wave-data-pipeline.md'
      - '.github/workflows/wave-pipeline.yml'
  push:
    branches:
      - main
      - dev
    paths:
      - 'deploy/almalinux/wavelab-ww3-package-builder'
      - 'deploy/almalinux/wavelab-ecwam-package-builder'
      - 'deploy/almalinux/ww3-package-builder.env.example'
      - 'deploy/almalinux/ecwam-package-builder.env.example'
      - 'wavetiles/pipeline/**'
      - 'wavetiles/scripts/normalize_ww3_cycle.py'
      - 'wavetiles/scripts/normalize_ecwam_cycle.py'
      - 'wavetiles/scripts/build_normalized_ww3_shadow.py'
      - 'wavetiles/scripts/build_normalized_ecwam_shadow.py'
      - 'wavetiles/scripts/build_ww3_compatible_package.sh'
      - 'wavetiles/scripts/build_ecwam_compatible_package.sh'
      - 'wavetiles/scripts/run_normalized_wave_package.py'
      - 'wavetiles/scripts/write_wave_pipeline_status.py'
      - 'wavetiles/scripts/publish_wave_package.py'
      - 'wavetiles/scripts/ww3_package_selection.py'
      - 'wavetiles/scripts/ecwam_package_selection.py'
      - 'wavetiles/tests/test_wave_contract.py'
      - 'wavetiles/tests/test_normalized_reader.py'
      - 'wavetiles/tests/test_normalized_wave_runner.py'
      - 'wavetiles/tests/test_wave_pipeline_status.py'
      - 'wavetiles/tests/test_wave_package_publisher.py'
      - 'wavetiles/tests/test_ww3_adapter.py'
      - 'wavetiles/tests/test_ecwam_adapter.py'
      - 'wavetiles/tests/test_ww3_package_selection.py'
      - 'docs/architecture/wave-data-pipeline.md'
      - '.github/workflows/wave-pipeline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  normalized-wave-contract:
    name: Normalized wave contract and model adapters
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: wavetiles/requirements.txt

      - name: Install pipeline test dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas xarray netCDF4

      - name: Run normalized wave contract tests
        run: python -m unittest wavetiles.tests.test_wave_contract -v

      - name: Run normalized cycle reader tests
        run: python -m unittest wavetiles.tests.test_normalized_reader -v

      - name: Run common normalized runner tests
        run: python -m unittest wavetiles.tests.test_normalized_wave_runner -v

      - name: Run pipeline status tests
        run: python -m unittest wavetiles.tests.test_wave_pipeline_status -v

      - name: Run package publisher tests
        run: python -m unittest wavetiles.tests.test_wave_package_publisher -v

      - name: Run WW3 selector tests
        run: python -m unittest wavetiles.tests.test_ww3_package_selection -v

      - name: Run WW3 adapter tests
        run: python -m unittest wavetiles.tests.test_ww3_adapter -v

      - name: Run ECWAM adapter tests
        run: python -m unittest wavetiles.tests.test_ecwam_adapter -v

      - name: Validate builder shell syntax
        run: |
          bash -n deploy/almalinux/wavelab-ww3-package-builder
          bash -n deploy/almalinux/wavelab-ecwam-package-builder
          bash -n wavetiles/scripts/build_ww3_compatible_package.sh
          bash -n wavetiles/scripts/build_ecwam_compatible_package.sh

      - name: Compile pipeline and package modules
        run: >-
          python -m compileall -q
          wavetiles/pipeline
          wavetiles/scripts/normalize_ww3_cycle.py
          wavetiles/scripts/normalize_ecwam_cycle.py
          wavetiles/scripts/build_normalized_ww3_shadow.py
          wavetiles/scripts/build_normalized_ecwam_shadow.py
          wavetiles/scripts/run_normalized_wave_package.py
          wavetiles/scripts/write_wave_pipeline_status.py
          wavetiles/scripts/publish_wave_package.py
          wavetiles/scripts/ww3_package_selection.py
          wavetiles/scripts/ecwam_package_selection.py
