server {
    listen 80;
    server_name __PUBLIC_HOST__;

    root __FRONTEND_ROOT__;
    index index.html;

    client_max_body_size 10m;

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Socket.IO websocket transport
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000/socket.io/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Generated WW3 XYZ tiles.
    # URL example: /wavetiles/WW3/light/2026JUN24/2026062418/5/25/14.png
    location /wavetiles/ {
        alias __APP_ROOT__/wavetiles/tiles/;
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Vite single-page app fallback.
    # Do not include $uri/ here. If a frontend route such as /charts matches a
    # real directory without an index file, Nginx returns 403 before React can
    # render the page. Unknown non-file routes should always fall back to index.html.
    location / {
        try_files $uri /index.html;
    }

    # Static asset caching for built frontend files
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
